name: STFC Server 133 Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python
        run: python --version

      - name: Check webhook format
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [[ "$DISCORD_WEBHOOK" == https://discord.com/api/webhooks/* ]]; then
            echo "Webhook format looks correct"
          else
            echo "Webhook format is WRONG"
            exit 1
          fi

      - name: Run STFC monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
