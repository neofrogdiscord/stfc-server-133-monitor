name: STFC Server 133 Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
          - name: Test STFC Live EU1
        run: |
          echo "Testing cdn-live-eu1-web.startrek.digitgaming.com"
          curl -v https://cdn-live-eu1-web.startrek.digitgaming.com/ 2>&1
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record start time
        run: |
          echo "Workflow started at:"
          date -u

      - name: Check Python
        run: python --version

      - name: Test STFC Live EU1
        run: |
          echo "Testing cdn-live-eu1-web.startrek.digitgaming.com"
          curl -v https://cdn-live-eu1-web.startrek.digitgaming.com/ 2>&1

      - name: Run STFC monitor
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py
